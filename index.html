    L.push("BEGIN:VEVENT","UID:"+k+"-"+P[p][0].toLowerCase()+"@cuadrante2027","DTSTAMP:"+ts,"DTSTART;TZID=Europe/Madrid:"+f(t)+"T"+hi.replace(":","")+"00","DTEND;TZID=Europe/Madrid:"+f(t)+"T"+hf.replace(":","")+"00",
      "SUMMARY:"+ie(P[p][0]+" ("+h+"h)"+(no.k?" · Cita"+(no.t?": "+no.t:""):"")));
    if(det)L.push("DESCRIPTION:"+ie(det));
    L.push("END:VEVENT");
  }
  L.push("END:VCALENDAR");
  const blob=new Blob([L.map(fold).join("\r\n")+"\r\n"],{type:"text/calendar;charset=utf-8"}),l=document.createElement("a");
  l.href=URL.createObjectURL(blob);l.download="cuadrante-2027"+(mv==="all"?"":"-"+MN[m0])+(pp>=0?"-"+P[pp][0].toLowerCase():"")+".ics";
  document.body.appendChild(l);l.click();l.remove();
}

}
